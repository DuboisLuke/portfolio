<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Map viewer" hidden>
<button class="lb-close" id="lbClose" aria-label="Close">×</button>
<button class="lb-prev" id="lbPrev" aria-label="Previous map">‹</button>
<figure class="lb-figure"><img id="lbImg" src="" alt=""><figcaption id="lbCap"></figcaption></figure>
<button class="lb-next" id="lbNext" aria-label="Next map">›</button>
</div>
<script>
(function(){
  var figs = Array.prototype.slice.call(document.querySelectorAll('.grid figure'));
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lbImg');
  var cap = document.getElementById('lbCap');
  var current = 0;
  function show(i){
    current = (i + figs.length) % figs.length;
    var f = figs[current];
    var im = f.querySelector('img');
    img.src = im.getAttribute('src');
    img.alt = im.getAttribute('alt') || '';
    cap.innerHTML = f.querySelector('figcaption').innerHTML;
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function hide(){ lb.hidden = true; document.body.style.overflow = ''; }
  figs.forEach(function(f, i){
    f.addEventListener('click', function(){ show(i); });
  });
  document.getElementById('lbClose').addEventListener('click', hide);
  document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); show(current + 1); });
  lb.addEventListener('click', function(e){ if(e.target === lb) hide(); });
  document.addEventListener('keydown', function(e){
    if(lb.hidden) return;
    if(e.key === 'Escape') hide();
    if(e.key === 'ArrowLeft') show(current - 1);
    if(e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>
